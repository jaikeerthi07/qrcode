<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay to handle autoplay blocking */
        #play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 24px;
            font-family: Arial, sans-serif;
            z-index: 100;
            cursor: pointer;
            display: none;
        }
    </style>
</head>

<body>
    <!-- Visible overlay with button -->
    <div id="play-overlay"
        style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:100; display:flex; justify-content:center; align-items:center; background-color: rgba(0,0,0,0.5);">
        <button id="start-btn"
            style="padding: 15px 30px; font-size: 20px; font-weight: bold; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            Tap to go Google Map
        </button>
    </div>

    <video id="main-video" src="animation.mp4" playsinline preload="auto"
        style="pointer-events: none; user-select: none;"></video>

    <script>
        const video = document.getElementById('main-video');
        const playOverlay = document.getElementById('play-overlay');
        const startBtn = document.getElementById('start-btn');
        let redirected = false;

        function redirectToMap() {
            if (redirected) return;
            redirected = true;
            window.location.href = "https://www.google.com/maps/search/?api=1&query=AR+Grands,+No+5C%2F1,+Sidco+Main+Rd,+near+TNEB,+Kodungaiyur+(East),+Vivekananda+Nagar,+Chennai+-+600118";
        }

        // Start playback with sound when the button is tapped
        startBtn.addEventListener('click', () => {
            playOverlay.style.display = 'none';
            // Play directly with sound (allowed because of user interaction)
            video.play().catch(console.error);
        });

        // Redirect at the end of the video
        video.addEventListener('ended', redirectToMap);

        // Fallback in case ended doesn't fire fast enough
        video.addEventListener('timeupdate', () => {
            if (video.duration && (video.duration - video.currentTime) < 0.2) {
                video.pause();
                redirectToMap();
            }
        });
    </script>
</body>

</html>

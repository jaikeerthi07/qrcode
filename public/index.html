<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Grands Video & Location</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 1s ease-in-out;
            z-index: 10;
            background-color: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #map-container {
            width: 100%;
            height: 100%;
            display: none;
            opacity: 0;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            background-color: white;
            z-index: 20;
            transition: opacity 1s ease-in-out;
        }

        .map-header {
            width: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            color: white;
            box-sizing: border-box;
        }

        .map-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .map-header p {
            margin: 8px 0 0 0;
            font-size: 0.95rem;
            color: #d1d9e6;
            line-height: 1.4;
        }

        .map-wrapper {
            flex-grow: 1;
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .replay-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            background-color: #1e3c72;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 30;
            transition: background-color 0.3s;
        }

        .replay-btn:hover {
            background-color: #2a5298;
        }
    </style>
</head>

<body>
    <div id="video-container">
        <!-- Replaced loop attribute with standard muted/autoplay/controls so it stops at the end -->
        <video id="main-video" src="animation.mp4" playsinline autoplay muted controls></video>
    </div>

    <div id="map-container">
        <div class="map-header">
            <h2>AR GRANDS</h2>
            <p>No 5C/1, Sidco Main Rd, near TNEB,<br>Kodungaiyur (East), Vivekananda Nagar, Chennai – 600118</p>
        </div>
        <div class="map-wrapper">
            <iframe
                src="https://maps.google.com/maps?width=100%25&height=600&hl=en&q=No%205C/1,%20Sidco%20Main%20Rd,%20near%20TNEB,%20Kodungaiyur%20(East),%20Vivekananda%20Nagar,%20Chennai%20-%20600118&t=&z=16&ie=UTF8&iwloc=B&output=embed"
                allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
        <button class="replay-btn" id="replay-btn">Replay Video</button>
    </div>

    <script>
        const video = document.getElementById('main-video');
        const videoContainer = document.getElementById('video-container');
        const mapContainer = document.getElementById('map-container');
        const replayBtn = document.getElementById('replay-btn');

        let mapShown = false;

        function showMap() {
            if (mapShown) return;
            mapShown = true;

            // Fade out video
            videoContainer.style.opacity = '0';

            // Show map and fade in
            mapContainer.style.display = 'flex';
            setTimeout(() => {
                mapContainer.style.opacity = '1';
                setTimeout(() => {
                    videoContainer.style.display = 'none';
                }, 1000);
            }, 50);
        }

        // When the video ends, show the map smoothly
        video.addEventListener('ended', showMap);

        // As a fallback, if the user manually scrubs near to the end
        video.addEventListener('timeupdate', () => {
            if (video.duration && (video.duration - video.currentTime) < 0.2) {
                video.pause();
                showMap();
            }
        });

        // Replay functionality
        replayBtn.addEventListener('click', () => {
            mapShown = false;
            mapContainer.style.opacity = '0';
            videoContainer.style.display = 'flex';

            setTimeout(() => {
                mapContainer.style.display = 'none';
                videoContainer.style.opacity = '1';
                video.currentTime = 0;
                video.play();
            }, 1000);
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <video id="main-video" src="baby_animation2.mp4" playsinline autoplay muted
        style="pointer-events: none; user-select: none;"></video>

    <script>
        const video = document.getElementById('main-video');
        let redirected = false;

        function redirectToMap() {
            if (redirected) return;
            redirected = true;
            // Native open in Google Maps app / web
            window.location.href = "https://www.google.com/maps/search/?api=1&query=AR+Grands,+No+5C%2F1,+Sidco+Main+Rd,+near+TNEB,+Kodungaiyur+(East),+Vivekananda+Nagar,+Chennai+-+600118";
        }

        // Redirect at the end of the video
        video.addEventListener('ended', redirectToMap);

        // Fallback in case ended doesn't fire fast enough
        video.addEventListener('timeupdate', () => {
            if (video.duration && (video.duration - video.currentTime) < 0.2) {
                video.pause();
                redirectToMap();
            }
        });
    </script>
</body>

</html>
